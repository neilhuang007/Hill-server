  install-template: world-templates/hill_auth
  install-world-name: hill_auth
  placement-file: hill-world.yml (spawn)
  smoke-test-map:
    name: Small Medieval Church 1.0.5
    creators: CoinCoffer and TheHyperboloid
    project-page: https://www.curseforge.com/minecraft/worlds/small-medieval-church
    availability: the creator's file listing was withdrawn; the former direct download returns 404 (checked 2026-10-12)
    sha256: de98674487bcd69593c36a03b1204a7d14ff694f281508d156e53650e31e4630
    permission: All Rights Reserved; smoke-test use only, direct permission from the creator still pending. Not a deployment input and not redistributed.
    spawn: [131.5, 52.1, 163.5, 0.0, 0.0]
    minecraft-version: 26.2

