name: Source checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test plugin
        run: bash ./gradlew clean test jar --no-daemon
      - name: Check operation script syntax
        run: |
          for script in ops/*.sh; do bash -n "$script"; done
          for script in ops/*.mjs; do node --check "$script"; done
          python3 -m compileall -q ops scripts tests
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem ops -Filter *.ps1) + @(Get-ChildItem . -Filter Open-Hill-*.ps1)
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
