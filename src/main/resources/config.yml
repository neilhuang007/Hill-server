# Hill 175 development configuration.
# School account linking intentionally uses the always-approve stub until Hill selects an identity provider.
authentication:
  provider: always-approve-development-stub
  # Required safety acknowledgement. Replace the identity adapter before a real competition launch.
  development-stub-acknowledged: true
  stub-link-base-url: https://example.invalid/hill175/link
  stub-link-delay-ticks: 20
  password-min-length: 8

worlds:
  authentication: hill_auth
  authentication-spawn:
    x: 131.5
    y: 52.1
    z: 163.5
    yaw: 0.0
    pitch: 0.0
  hub: hill_hub
  hub-spawn:
    # Block-centred arrival point supplied with the Hill-owned exhibition map.
    # Yaw 0 faces south toward the three category personnel at z=70.
    x: 70.5
    y: 66.1
    z: 42.5
    yaw: 0.0
    pitch: 0.0
  hub-npcs:
    journey:
      profile-name: HillJourney
      # Smoke skin: surveyor/builder. Replace with a Hill-owned texture before public launch.
      skin-texture: af41e2561a2c959f56df5dcda564397df1971d652e1ac159d8b4c74733026077
      x: 70.5
      y: 67.0
      z: 70.5
      yaw: 180.0
      pitch: 0.0
    place:
      profile-name: HillPlace
      # Smoke skin: contemporary interior designer. Replace with a Hill-owned texture before public launch.
      skin-texture: 6ac6ca262d67bcfb3dbc924ba8215a18195497c780058a5749de674217721892
      x: 70.5
      y: 75.0
      z: 70.5
      yaw: 180.0
      pitch: 0.0
    people:
      profile-name: HillPeople
      # Smoke skin: scientist/community planner. Replace with a Hill-owned texture before public launch.
      skin-texture: 9658c5ac64cdd7189e8db50393f27439fc9ce9177c9c5285d6f1f7b4eda9d7ec
      x: 70.5
      y: 61.0
      z: 70.5
      yaw: 180.0
      pitch: 0.0
    survival:
      profile-name: HillSurvival
      # Smoke skin: surveyor/builder. Replace with a Hill-owned survival guide texture before public launch.
      skin-texture: af41e2561a2c959f56df5dcda564397df1971d652e1ac159d8b4c74733026077
      x: 70.5
      y: 66.0
      z: 31.5
      yaw: 0.0
      pitch: 0.0
  journey: hill_journey
  place: hill_place
  survival: world
  survival-nether: world_nether
  survival-end: world_the_end

people:
  # Extract a rights-cleared campus template to this folder before creating People entries.
  template-folder: world-templates/hill_people_template
  # Production must fail closed instead of silently substituting flat generated terrain.
  require-template: true
  template-region-file-count: 26
  template-poi-file-count: 11
  # Optional fallback. Leave blank when using a prepared Anvil template folder.
  structure-file: ""
  structure-import-blocks-per-tick: 12000
  # Hard main-thread time budget so registration and UI ticks stay responsive during template warm-up.
  structure-import-max-millis-per-tick: 10
  structure-origin-y: 64
  fallback-seed: 175
  build-radius: 1400
  world-border-size: 2865.0

build-rules:
  max-non-player-entities-per-entry: 128

privacy:
  # Purge this audit data 30 days after the event; the exact event-end timestamp is not configured yet.
  connection-audit-retention-days-after-event: 30
