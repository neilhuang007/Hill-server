name: Hill175
version: '${version}'
main: org.thehill.hill175.Hill175Plugin
api-version: '26.2'
load: POSTWORLD
softdepend: [floodgate]
authors: [The Hill School]
description: Hill School 175th Anniversary Minecraft competition server
commands:
  verify:
    description: Sign in with your Hill Microsoft account and confirm the browser code
    usage: /verify [browser-code]
  register:
    description: Register your connected Minecraft account with a competition password
    usage: /register <password> <repeatPassword>
  login:
    description: Authenticate with the competition password
    usage: /login <password>
  hill175:
    description: Open the Hill 175 competition menu
    aliases: [h175]
  competition:
    description: Open the Hill 175 competition menu
  hub:
    description: Return to the exhibition hub
  lobby:
    description: Return to the exhibition hub
  rules:
    description: Show competition rules
  help:
    description: Show Hill 175 competition commands
  entry:
    description: Manage competition entries
  team:
    description: Manage a two-person entry team
  camera:
    description: Save and manage submission camera poses
  campus:
    description: Open your campus map and building controls
  campusbackup:
    description: List, save and restore shared campus backups
permissions:
  hill175.campus.rollback:
    description: Save and restore the shared campus
    default: op
  hill175.staff:
    description: Faculty moderation tools
    default: op
